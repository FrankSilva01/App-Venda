<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cardápio da mesa</title>
<link rel="stylesheet" href="app.css">
<style>
  /* Tela do CLIENTE. Separada do painel de proposito: quem senta na mesa nao
     vê salão, cozinha, caixa nem configuração, e a página abre direto no
     cardápio -- sem login e sem escolher mesa (o QR já sabe qual é).

     Mobile-first: o alvo é um celular de 375px com uma mão só. */
  body { background: var(--papel); }
  .tela { max-width: 460px; margin: 0 auto; min-height: 100vh;
    display: flex; flex-direction: column; background: var(--papel); }
  .cabeca { padding: 14px 18px; border-bottom: 1px solid var(--linha);
    display: flex; align-items: center; gap: 12px; position: sticky; top: 0;
    background: var(--papel); z-index: 5; }
  .cabeca .casa { font-size: 11.5px; letter-spacing: .12em; text-transform: uppercase;
    color: var(--suave); }
  .cabeca b { font-size: 19px; display: block; }
  .abas { display: flex; gap: 6px; padding: 10px 18px 0; }
  .abas button { flex: 1; border: 0; background: var(--quente); border-radius: 10px;
    padding: 10px 6px; font: inherit; font-size: 13.5px; font-weight: 600;
    color: var(--suave); cursor: pointer; min-height: 42px; position: relative; }
  .abas button.on { background: var(--ink); color: #fff; }
  .abas .conta { background: var(--verde); color: #fff; border-radius: 999px;
    font-size: 11px; padding: 0 6px; margin-left: 4px; }
  main { flex: 1; padding: 14px 18px 20px; }
  .busca { margin-bottom: 12px; }
  .cats { display: flex; gap: 7px; overflow-x: auto; padding-bottom: 12px; }
  .cats button { border: 1px solid var(--linha); background: var(--papel); color: var(--ink);
    border-radius: 999px; padding: 7px 14px; font: inherit; font-size: 13px;
    white-space: nowrap; cursor: pointer; min-height: 38px; }
  .cats button.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  .prod { display: flex; gap: 12px; border: 1px solid var(--linha); border-radius: 14px;
    padding: 12px; margin-bottom: 10px; align-items: flex-start; width: 100%;
    text-align: left; background: var(--papel); font: inherit; color: inherit; cursor: pointer; }
  .prod img { width: 76px; height: 76px; border-radius: 10px; object-fit: cover;
    background: var(--quente); flex: none; }
  .prod .nome { font-weight: 600; font-size: 15px; }
  .prod .desc { font-size: 12.5px; color: var(--suave); margin-top: 2px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .prod .preco { font-weight: 700; margin-top: 6px; }
  .capa { height: 190px; border-radius: 14px; background: var(--quente); width: 100%;
    object-fit: cover; margin-bottom: 14px; }
  .obs { font-size: 12.5px; color: #7A3A12; background: #FBEDE3; border-radius: 5px;
    padding: 2px 7px; display: block; width: fit-content; margin-top: 4px; }
  .qtd { min-width: 26px; height: 26px; border-radius: 7px; background: var(--ink); color: #fff;
    display: flex; align-items: center; justify-content: center; font-size: 13px;
    font-weight: 700; flex: none; }
  .rodape { position: sticky; bottom: 0; background: var(--papel);
    border-top: 1px solid var(--linha); padding: 12px 18px calc(12px + env(safe-area-inset-bottom));
    display: flex; flex-direction: column; gap: 8px; }
  .passos { display: flex; gap: 6px; margin-top: 12px; }
  .passos div { flex: 1; height: 5px; border-radius: 999px; background: var(--linha); }
  .passos div.on { background: var(--verde); }
</style>
</head>
<body>
<div class="tela">
  <header class="cabeca">
    <div style="flex:1">
      <span class="casa" id="casa"></span>
      <b id="tituloMesa">Carregando…</b>
      <span class="nota" id="subMesa">lendo o QR da mesa</span>
    </div>
    <button class="btn sec pequeno" id="chamar" hidden>Chamar garçom</button>
  </header>
  <div class="abas" id="abas" hidden>
    <button data-v="cardapio" class="on">Cardápio</button>
    <button data-v="comanda">Comanda</button>
    <button data-v="pedidos">Meus pedidos</button>
  </div>
  <main id="tela"></main>
  <div class="rodape" id="rodape" hidden></div>
</div>

<script src="comum.js"></script>
<script>
// Duas coisas chegam pela URL do QR:
//   ?t=TOKEN   obrigatório -- diz QUAL mesa é. Não é o número da mesa: número
//              se adivinha trocando um dígito, e não dá para revogar.
//   ?api=URL   opcional -- endereço da API visto pelo celular do cliente.
// Esta tela nunca manda sessao do painel: ver o comentario de SEM_SESSAO em
// comum.js. Quem identifica a mesa e o token do QR.
SEM_SESSAO = true;

var P = new URLSearchParams(location.search);
var TOKEN = P.get('t') || '';
if (P.get('api')) guardaApi(P.get('api'));

var DADOS = null, CARRINHO = [], VISTA = 'cardapio', CATEGORIA = '', BUSCA = '';
var ABERTO = null, ENVIADO = null, pararFluxo = null;

async function carrega() { DADOS = await api('/api/qr/' + encodeURIComponent(TOKEN)); }

function pagamento() { return DADOS.pagamento; }

// ------------------------------------------------------------------ telas
function pinta() {
  $$('[data-v]').forEach(function (b) {
    b.className = b.getAttribute('data-v') === VISTA ? 'on' : '';
  });
  var naComanda = CARRINHO.reduce(function (s, i) { return s + i.qtd; }, 0);
  var abaComanda = $('[data-v="comanda"]');
  abaComanda.innerHTML = 'Comanda' + (naComanda ? '<span class="conta">' + naComanda + '</span>' : '');

  $('#rodape').hidden = true;
  $('#rodape').innerHTML = '';
  if (ENVIADO) return telaEnviado();
  if (ABERTO) return telaItem();
  if (VISTA === 'cardapio') return telaCardapio();
  if (VISTA === 'comanda') return telaComanda();
  return telaPedidos();
}

function telaCardapio() {
  var cats = [];
  DADOS.produtos.forEach(function (p) {
    if (p.categoria && cats.indexOf(p.categoria) < 0) cats.push(p.categoria);
  });
  var lista = DADOS.produtos.filter(function (p) {
    if (CATEGORIA && p.categoria !== CATEGORIA) return false;
    if (!BUSCA) return true;
    return (p.nomeproduto + ' ' + (p.descricaoproduto || '')).toLowerCase()
      .indexOf(BUSCA.toLowerCase()) >= 0;
  });

  $('#tela').innerHTML =
    '<input class="busca" id="busca" placeholder="Buscar no cardápio…" value="' + esc(BUSCA) + '">' +
    (cats.length > 1 ? '<div class="cats">' +
      '<button data-cat=""' + (CATEGORIA ? '' : ' class="on"') + '>Tudo</button>' +
      cats.map(function (c) {
        return '<button data-cat="' + esc(c) + '"' + (CATEGORIA === c ? ' class="on"' : '') + '>' +
          esc(c) + '</button>';
      }).join('') + '</div>' : '') +
    (lista.length ? lista.map(function (p) {
      return '<button class="prod" data-p="' + p.idnomeproduto + '">' +
        (p.imagemproduto
          ? '<img src="' + API + '/upload/' + encodeURIComponent(p.imagemproduto) + '" alt="">'
          : '<img alt="">') +
        '<span style="flex:1;min-width:0">' +
          (p.categoria ? '<span class="nota" style="font-size:11px;text-transform:uppercase;' +
            'letter-spacing:.06em">' + esc(p.categoria) + '</span>' : '') +
          '<span class="nome" style="display:block">' + esc(p.nomeproduto) + '</span>' +
          '<span class="desc">' + esc(p.descricaoproduto || '') + '</span>' +
          '<span class="preco" style="display:block">' + moeda(p.precoproduto) + '</span>' +
        '</span></button>';
    }).join('') : '<div class="vazio">Nada encontrado.</div>');

  $('#busca').oninput = function () {
    BUSCA = this.value;
    var f = this.selectionStart;
    pinta();
    var novo = $('#busca');
    novo.focus();
    novo.setSelectionRange(f, f);
  };
  $$('[data-cat]').forEach(function (b) {
    b.onclick = function () { CATEGORIA = b.getAttribute('data-cat'); pinta(); };
  });
  $$('[data-p]').forEach(function (b) {
    b.onclick = function () {
      ABERTO = { id: Number(b.getAttribute('data-p')), qtd: 1, obs: '', extras: [] };
      pinta();
    };
  });

  if (CARRINHO.length) {
    var n = CARRINHO.reduce(function (s, i) { return s + i.qtd; }, 0);
    var t = CARRINHO.reduce(function (s, i) { return s + i.preco * i.qtd; }, 0);
    $('#rodape').hidden = false;
    $('#rodape').innerHTML = '<button class="btn largo" id="irComanda">Ver comanda · ' + n +
      (n > 1 ? ' itens · ' : ' item · ') + moeda(t) + '</button>';
    $('#irComanda').onclick = function () { VISTA = 'comanda'; pinta(); };
  }
}

// Escolher o item é uma TELA, não um modal: no celular, modal com teclado
// aberto empurra o botão para fora da área visível.
function telaItem() {
  var p = DADOS.produtos.filter(function (x) { return x.idnomeproduto === ABERTO.id; })[0];
  if (!p) { ABERTO = null; return pinta(); }
  var extras = p.adicionais || [];

  function unitario() {
    return extras.filter(function (a) { return ABERTO.extras.indexOf(a.id) >= 0; })
      .reduce(function (s, a) { return s + Number(a.preco); }, Number(p.precoproduto));
  }

  $('#tela').innerHTML =
    '<button class="btn sec pequeno" id="voltar" style="margin-bottom:14px">← Voltar</button>' +
    (p.imagemproduto
      ? '<img class="capa" src="' + API + '/upload/' + encodeURIComponent(p.imagemproduto) + '" alt="">'
      : '<div class="capa"></div>') +
    '<h1 style="font-size:22px">' + esc(p.nomeproduto) + '</h1>' +
    '<p class="nota" style="margin:6px 0 10px">' + esc(p.descricaoproduto || '') + '</p>' +
    '<div style="font-size:20px;font-weight:700;margin-bottom:18px">' + moeda(p.precoproduto) + '</div>' +
    (extras.length
      ? ['complemento', 'adicional'].map(function (tipo) {
          var doTipo = extras.filter(function (a) { return a.tipo === tipo; });
          if (!doTipo.length) return '';
          return '<div style="margin-bottom:16px">' +
            '<label>' + (tipo === 'adicional' ? 'Adicionais' : 'Complementos') + '</label>' +
            doTipo.map(function (a) {
              return '<label class="item" style="font-weight:400;cursor:pointer">' +
                '<input type="checkbox" data-ad="' + a.id + '"' +
                  (ABERTO.extras.indexOf(a.id) >= 0 ? ' checked' : '') +
                  ' style="width:18px;min-height:0;accent-color:var(--verde)">' +
                esc(a.nome) + '<span class="empurra nota">' +
                (Number(a.preco) ? '+ ' + moeda(a.preco) : 'sem custo') + '</span></label>';
            }).join('') + '</div>';
        }).join('')
      : '') +
    '<div><label for="obs">Alguma observação?</label>' +
      '<textarea id="obs" rows="3" placeholder="ex: sem cebola">' + esc(ABERTO.obs) + '</textarea>' +
      '<p class="nota">Vai escrito na comanda da cozinha, do jeito que você digitar.</p></div>';

  $('#voltar').onclick = function () { ABERTO = null; pinta(); };
  $('#obs').oninput = function () { ABERTO.obs = this.value; };
  $$('[data-ad]').forEach(function (c) {
    c.onchange = function () {
      var id = Number(c.getAttribute('data-ad'));
      ABERTO.extras = ABERTO.extras.filter(function (x) { return x !== id; });
      if (c.checked) ABERTO.extras.push(id);
      atualizaBotao();
    };
  });

  $('#rodape').hidden = false;
  $('#rodape').innerHTML =
    '<div style="display:flex;gap:10px;align-items:center">' +
      '<div style="display:flex;align-items:center;border:1px solid var(--linha);border-radius:11px">' +
        '<button class="btn sec" id="menos" style="width:46px;border:0;min-height:48px">−</button>' +
        '<span id="qtd" style="min-width:30px;text-align:center;font-weight:700">' + ABERTO.qtd + '</span>' +
        '<button class="btn sec" id="mais" style="width:46px;border:0;min-height:48px">+</button>' +
      '</div>' +
      '<button class="btn" id="add" style="flex:1;min-height:48px">Adicionar ao pedido</button>' +
    '</div>';

  function atualizaBotao() {
    $('#qtd').textContent = ABERTO.qtd;
    $('#add').textContent = 'Adicionar ' + moeda(unitario() * ABERTO.qtd);
  }
  atualizaBotao();
  $('#menos').onclick = function () { ABERTO.qtd = Math.max(1, ABERTO.qtd - 1); atualizaBotao(); };
  $('#mais').onclick = function () { ABERTO.qtd++; atualizaBotao(); };
  $('#add').onclick = function () {
    CARRINHO.push({
      id: p.idnomeproduto, nome: p.nomeproduto, preco: unitario(), qtd: ABERTO.qtd,
      obs: ABERTO.obs, extras: ABERTO.extras.slice(),
      nomesExtras: extras.filter(function (a) { return ABERTO.extras.indexOf(a.id) >= 0; })
        .map(function (a) { return a.nome; }),
    });
    ABERTO = null;
    VISTA = 'cardapio';
    pinta();
  };
}

function telaComanda() {
  var pg = pagamento();
  var meu = CARRINHO.reduce(function (s, i) { return s + i.preco * i.qtd; }, 0);
  var t = DADOS.totais;

  $('#tela').innerHTML =
    '<div id="msg"></div>' +
    (CARRINHO.length
      ? '<label>Enviando agora</label>' +
        CARRINHO.map(function (i, n) {
          return '<div class="item"><span class="qtd">' + i.qtd + '</span>' +
            '<span style="flex:1;min-width:0">' + esc(i.nome) +
              (i.nomesExtras && i.nomesExtras.length
                ? '<span class="nota" style="display:block">+ ' +
                  esc(i.nomesExtras.join(', ')) + '</span>' : '') +
              (i.obs ? '<span class="obs">' + esc(i.obs) + '</span>' : '') + '</span>' +
            '<span style="font-weight:600">' + moeda(i.preco * i.qtd) + '</span>' +
            '<button class="btn sec pequeno" data-rm="' + n + '" ' +
              'style="color:var(--laranja);padding:4px 9px">×</button></div>';
        }).join('') +
        '<div class="total"><span>Subtotal</span><b>' + moeda(meu) + '</b></div>'
      : '<div class="vazio">Nada escolhido ainda.</div>') +

    (DADOS.pedidos && DADOS.pedidos.length
      ? '<label style="margin-top:22px">Já na comanda da mesa</label>' +
        DADOS.pedidos.filter(function (p) { return p.status !== 'cancelado'; })
          .map(function (p) {
            return p.itens.map(function (i) {
              return '<div class="item" style="opacity:.75">' +
                '<span class="qtd" style="background:var(--quente);color:var(--ink)">' +
                  i.quantidade + '</span>' +
                '<span style="flex:1">' + esc(i.nome) +
                  (p.cliente ? ' <span class="nota">· ' + esc(p.cliente) + '</span>' : '') + '</span>' +
                '<span style="font-weight:600">' + moeda(i.preco * i.quantidade) + '</span></div>';
            }).join('');
          }).join('') +
        (t ? '<div style="background:var(--quente);border-radius:12px;padding:14px;margin-top:14px">' +
            '<div class="item" style="border:0;padding:4px 0"><span class="nota">Consumo da mesa</span>' +
              '<span class="empurra">' + moeda(t.consumo) + '</span></div>' +
            (t.servico_cobrado
              ? '<div class="item" style="border:0;padding:4px 0"><span class="nota">Serviço ' +
                  t.servico_percentual + '%</span><span class="empurra">' + moeda(t.servico) + '</span></div>'
              : '<div class="item" style="border:0;padding:4px 0"><span class="nota">Sem taxa de serviço' +
                  '</span><span class="empurra">—</span></div>') +
            (t.pago > 0 ? '<div class="item" style="border:0;padding:4px 0">' +
              '<span class="nota">Já pago</span><span class="empurra">' + moeda(t.pago) + '</span></div>' : '') +
            '<div class="total"><span>' + (t.pago > 0 ? 'Falta' : 'Total') + '</span><b>' +
              moeda(t.pago > 0 ? t.saldo : t.total) + '</b></div>' +
          '</div>' : '')
      : '') +

    (CARRINHO.length
      ? '<div style="margin-top:18px"><label for="cliente">Seu nome</label>' +
        '<input id="cliente" placeholder="só para a cozinha saber de quem é" value="' +
          esc(localStorage.getItem('appvenda-cliente') || '') + '">' +
        '<p class="nota">Sem cadastro, sem senha.</p></div>'
      : '');

  $$('[data-rm]').forEach(function (b) {
    b.onclick = function () { CARRINHO.splice(Number(b.getAttribute('data-rm')), 1); pinta(); };
  });

  $('#rodape').hidden = false;

  // AQUI mora a regra que a tela anterior errava: o botão de pagar não existe
  // só porque a comanda tem valor. Ele depende do modo configurado.
  if (CARRINHO.length) {
    $('#rodape').innerHTML = pg.exige_pagar_agora
      ? '<button class="btn largo" id="bPagar">Pagar e enviar ' + moeda(meu) + '</button>' +
        '<p class="nota" style="text-align:center;margin:0">A cozinha recebe assim que o ' +
        'pagamento for aprovado.</p>'
      : '<button class="btn largo" id="bEnviar">Confirmar pedido</button>' +
        (pg.pode_pagar_agora
          ? '<button class="btn sec largo" id="bPagar">Pagar agora</button>'
          : '') +
        '<p class="nota" style="text-align:center;margin:0">' +
          (pg.pode_pagar_agora
            ? 'Ou deixe na conta e pague no fim.'
            : 'A conta fica aberta. Pagamento realizado no caixa.') + '</p>';
    if ($('#bEnviar')) $('#bEnviar').onclick = function () { envia(false); };
    if ($('#bPagar')) $('#bPagar').onclick = function () { envia(true); };
    return;
  }

  // Sem nada para enviar, mas com consumo: fechar a conta.
  if (t && t.saldo > 0) {
    var jaPediu = (DADOS.chamados || []).some(function (c) { return c.tipo === 'fechamento'; });
    $('#rodape').innerHTML =
      (pg.pode_pagar_agora
        ? '<button class="btn largo" id="pagarConta">Pagar ' + moeda(t.saldo) + ' no Pix</button>'
        : '') +
      (DADOS.cliente_pode_fechar
        ? '<button class="btn ' + (pg.pode_pagar_agora ? 'sec ' : '') + 'largo" id="fechar"' +
            (jaPediu ? ' disabled' : '') + '>' +
            (jaPediu ? 'Fechamento solicitado' : 'Solicitar fechamento') + '</button>'
        : '') +
      '<p class="nota" style="text-align:center;margin:0">' +
        (pg.pode_pagar_agora ? 'Ou peça a conta no caixa.' : 'Pagamento realizado no caixa.') + '</p>';
    if ($('#pagarConta')) $('#pagarConta').onclick = pagaConta;
    if ($('#fechar')) $('#fechar').onclick = function () { chama('fechamento'); };
  } else {
    $('#rodape').hidden = true;
  }
}

function telaPedidos() {
  var ps = (DADOS.pedidos || []);
  if (!ps.length) {
    $('#tela').innerHTML = '<div class="vazio">Nenhum pedido ainda.</div>';
    return;
  }
  var etapas = ['novo', 'preparo', 'pronto', 'entregue'];
  var rotulo = {
    aguardando: 'Aguardando pagamento', novo: 'Na fila da cozinha', preparo: 'Em preparo',
    pronto: 'Pronto', entregue: 'Na mesa', cancelado: 'Cancelado',
  };

  $('#tela').innerHTML = ps.map(function (p) {
    var atual = etapas.indexOf(p.status);
    var fim = p.status === 'entregue' || p.status === 'pronto';
    return '<div class="cartao" style="margin-bottom:12px">' +
      '<div class="entre" style="margin-bottom:8px"><b>Pedido #' + p.id + '</b>' +
        (p.cliente ? '<span class="nota">' + esc(p.cliente) + '</span>' : '') +
        '<span class="chip ' + (p.status === 'cancelado' ? 'vermelho' : (fim ? 'verde' : 'laranja')) +
          ' empurra">' + (rotulo[p.status] || p.status) + '</span></div>' +
      p.itens.map(function (i) {
        return '<div style="font-size:14px"><b>' + i.quantidade + '×</b> ' + esc(i.nome) +
          (i.adicionais && i.adicionais.length
            ? '<span class="nota"> + ' + esc(i.adicionais.map(function (a) {
                return a.nome; }).join(', ')) + '</span>' : '') +
          (i.observacao ? '<span class="obs">' + esc(i.observacao) + '</span>' : '') + '</div>';
      }).join('') +
      (p.status === 'cancelado'
        ? '<p class="nota" style="margin:10px 0 0">Cancelado' +
          (p.cancelado_motivo ? ': ' + esc(p.cancelado_motivo) : '') + '</p>'
        : p.status === 'aguardando'
          ? '<div class="aviso info" style="margin:10px 0 0">Esperando o pagamento para ir à cozinha.</div>'
          : '<div class="passos">' + etapas.map(function (e, n) {
              return '<div' + (n <= atual ? ' class="on"' : '') + '></div>';
            }).join('') + '</div>' +
            '<div class="entre nota" style="margin-top:5px"><span>Recebido</span>' +
              '<span>Preparo</span><span>Pronto</span><span class="empurra">Na mesa</span></div>') +
    '</div>';
  }).join('');
}

// Confirmação do pedido. Tela própria, com o que fazer em seguida -- antes o
// cliente era jogado de volta na lista sem saber se deu certo.
function telaEnviado() {
  var etapas = ['Recebido', 'Em preparo', 'Pronto', 'Entregue'];
  $('#tela').innerHTML =
    '<div style="text-align:center;padding:20px 0 10px">' +
      '<div style="width:56px;height:56px;border-radius:999px;background:var(--verde);' +
        'color:#fff;display:flex;align-items:center;justify-content:center;margin:0 auto 14px;' +
        'font-size:28px">✓</div>' +
      '<h1>Pedido enviado!</h1>' +
      '<p class="nota">Pedido #' + ENVIADO.pedido.id + ' · Mesa ' + DADOS.mesa.numero + '</p>' +
    '</div>' +
    '<div class="cartao">' + etapas.map(function (e, n) {
      return '<div class="item" style="border:0;padding:6px 0">' +
        '<span style="width:20px;height:20px;border-radius:999px;display:inline-flex;' +
          'align-items:center;justify-content:center;font-size:12px;color:#fff;background:' +
          (n === 0 ? 'var(--verde)' : 'var(--linha)') + '">' + (n === 0 ? '✓' : '') + '</span>' +
        '<span style="color:' + (n === 0 ? 'var(--ink)' : 'var(--suave)') + '">' + e + '</span></div>';
    }).join('') + '</div>' +
    (ENVIADO.aviso ? '<div class="aviso info">' + esc(ENVIADO.aviso) + '</div>' : '');

  $('#rodape').hidden = false;
  $('#rodape').innerHTML =
    '<button class="btn largo" id="mais">Pedir mais itens</button>' +
    '<button class="btn sec largo" id="ver">Ver meus pedidos</button>' +
    '<button class="btn sec largo" id="garcom">Chamar garçom</button>';
  $('#mais').onclick = function () { ENVIADO = null; VISTA = 'cardapio'; pinta(); };
  $('#ver').onclick = function () { ENVIADO = null; VISTA = 'pedidos'; pinta(); };
  $('#garcom').onclick = function () { chama('atendimento'); };
}

// ------------------------------------------------------------------ ações
function trava(sim) { $$('#rodape button').forEach(function (b) { b.disabled = sim; }); }

async function envia(pagarAgora) {
  trava(true);
  try {
    var nome = ($('#cliente') || {}).value || null;
    if (nome) localStorage.setItem('appvenda-cliente', nome);

    var r = await api('/api/pedidos', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        token: TOKEN, cliente: nome, pagar_agora: !!pagarAgora,
        itens: CARRINHO.map(function (i) {
          return {
            produto_id: i.id, quantidade: i.qtd,
            observacao: i.obs || null, adicionais: i.extras,
          };
        }),
      }),
    });

    // Pedido que espera pagamento só entra na cozinha depois desta chamada.
    if (!r.na_cozinha) {
      await api('/api/pagamento/pedido/' + r.pedido.id, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ forma: 'pix' }),
      });
    }

    CARRINHO = [];
    ENVIADO = r;
    await carrega();
    pinta();
  } catch (e) {
    trava(false);
    // O erro mais provável é item que acabou entre escolher e enviar: a
    // mensagem vem do servidor e diz qual.
    aviso('#msg', 'erro', e.message);
  }
}

async function pagaConta() {
  trava(true);
  try {
    await api('/api/pagamento/comanda/' + DADOS.comanda.id, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ forma: 'pix' }),
    });
    await carrega();
    pinta();
    aviso('#msg', 'ok', 'Conta paga. Obrigado!');
  } catch (e) { trava(false); aviso('#msg', 'erro', e.message); }
}

async function chama(tipo) {
  try {
    await api('/api/qr/' + TOKEN + '/chamado', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ tipo: tipo }),
    });
    await carrega();
    pinta();
    toast(tipo === 'fechamento'
      ? 'Fechamento solicitado. Já estão a caminho.'
      : 'Pronto, o garçom foi avisado.');
  } catch (e) { toast(e.message); }
}

// ------------------------------------------------------------------ carga
$$('[data-v]').forEach(function (b) {
  b.onclick = function () { VISTA = b.getAttribute('data-v'); ABERTO = null; ENVIADO = null; pinta(); };
});

(async function () {
  await resolveApi();
  if (!TOKEN) {
    $('#tituloMesa').textContent = 'QR code inválido';
    $('#subMesa').textContent = '';
    $('#tela').innerHTML = '<div class="aviso erro">Esta página abre pelo QR code da mesa. ' +
      'Peça ajuda a um atendente.</div>';
    return;
  }
  try {
    await carrega();
  } catch (e) {
    $('#tituloMesa').textContent = 'Não foi possível abrir';
    $('#subMesa').textContent = '';
    $('#tela').innerHTML = '<div class="aviso erro">' + esc(e.message) + '</div>' +
      '<p class="nota">Chame o garçom: o pedido pode ser feito direto com ele, ' +
      'do mesmo jeito.</p>' +
      // Esta parte é para quem administra, não para o cliente -- mas é aqui que
      // o problema aparece, e sem ela a tela só diz "falhou".
      (/github\.io/.test(location.hostname)
        ? '<details style="margin-top:18px"><summary class="nota">Informação técnica</summary>' +
          '<p class="nota">Esta página está em HTTPS e a API do restaurante responde em ' +
          'HTTP na rede local — o navegador bloqueia essa combinação. O QR precisa apontar ' +
          'para o endereço da própria API (<code>http://IP-DA-MÁQUINA:3001/mesa.html</code>), ' +
          'que serve esta tela na mesma origem. Ajuste em Configurações → Endereço do QR e ' +
          'regenere os QR das mesas.</p></details>'
        : '');
    return;
  }

  $('#casa').textContent = DADOS.estabelecimento || '';
  $('#tituloMesa').textContent = 'Mesa ' + DADOS.mesa.numero;
  $('#subMesa').textContent = DADOS.comanda
    ? 'Conta aberta'
    : (DADOS.pagamento.exige_pagar_agora ? 'Peça e pague pelo celular' : 'Peça pelo celular');
  $('#abas').hidden = false;
  $('#chamar').hidden = false;
  $('#chamar').onclick = function () { chama('atendimento'); };
  pinta();

  // O status anda sozinho: o cliente deixa o celular na mesa esperando a comida.
  pararFluxo = ouveFluxo('/api/qr/' + encodeURIComponent(TOKEN) + '/stream', async function () {
    try {
      await carrega();
      // Não repinta por cima de quem está escolhendo item ou digitando: o
      // evento é da cozinha, e perder o que foi digitado é pior do que
      // atualizar meio segundo depois.
      if (!ABERTO && !CARRINHO.length) pinta();
    } catch (e) { /* mantém a tela */ }
  });
})();
</script>
</body>
</html>
