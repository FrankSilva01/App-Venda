<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>App-Venda — painel</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<!-- Painel do RESTAURANTE. A tela do cliente e a mesa.html, que abre so pelo
     QR da mesa e nao compartilha menu nenhum com esta. -->
<div class="painel">
  <nav class="lateral">
    <div class="marca">App-Venda<small id="casa">painel</small></div>
    <div class="menu" id="menu"></div>
  </nav>

  <div class="conteudo">
    <header class="topo">
      <h1 id="titulo">Salão</h1>
      <div id="acoesTopo" class="entre"></div>
      <div class="quem">
        <div style="text-align:right;line-height:1.25">
          <div id="quemNome" style="font-weight:600"></div>
          <div id="quemPerfil" class="nota"></div>
        </div>
        <div class="avatar" id="avatar"></div>
        <button class="btn sec pequeno" id="sair">Sair</button>
      </div>
    </header>
    <main class="corpo" id="tela"></main>
  </div>
</div>

<script src="comum.js"></script>
<script src="app.js"></script>
</body>
</html>
