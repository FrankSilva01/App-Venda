<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>App-Venda</title>
<style>
  :root{
    --bg:#0f1116; --card:#171a21; --line:#262b36; --ink:#e7ebf2; --muted:#98a2b3;
    --azul:#3b82f6; --verde:#16a34a; --vermelho:#dc2626; --amarelo:#d97706;
  }
  @media (prefers-color-scheme: light){
    :root{ --bg:#f4f6f9; --card:#fff; --line:#e3e7ee; --ink:#1b2130; --muted:#5d6b84; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  header{background:var(--card);border-bottom:1px solid var(--line);padding:16px 20px;
    display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  header h1{margin:0;font-size:19px}
  header .sub{color:var(--muted);font-size:13px}
  .api{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:12.5px}
  .api input{width:210px;background:var(--bg);color:var(--ink);border:1px solid var(--line);
    border-radius:8px;padding:7px 9px;font:inherit;font-size:12.5px}
  .pino{width:9px;height:9px;border-radius:50%;background:var(--muted);flex:none}
  .pino.on{background:var(--verde)} .pino.off{background:var(--vermelho)}
  main{max-width:1040px;margin:0 auto;padding:20px}
  .abas{display:flex;gap:6px;background:var(--card);border:1px solid var(--line);
    border-radius:12px;padding:5px;margin-bottom:18px;flex-wrap:wrap}
  .abas button{flex:1;min-width:120px;border:0;background:transparent;border-radius:9px;
    padding:10px;font:inherit;font-weight:600;color:var(--muted);cursor:pointer}
  .abas button.on{background:var(--azul);color:#fff}
  .cartao{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;
    margin-bottom:16px}
  .cartao h2{margin:0 0 14px;font-size:16px}
  label{display:block;font-size:12.5px;color:var(--muted);margin:0 0 4px}
  input,select,textarea{width:100%;background:var(--bg);color:var(--ink);
    border:1px solid var(--line);border-radius:9px;padding:9px 11px;font:inherit}
  .linha{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:12px}
  button.acao{background:var(--azul);color:#fff;border:0;border-radius:9px;padding:10px 18px;
    font:inherit;font-weight:600;cursor:pointer}
  button.acao.sec{background:transparent;color:var(--ink);border:1px solid var(--line)}
  button.acao.perigo{background:var(--vermelho)}
  button.acao:disabled{opacity:.5;cursor:default}
  .grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
  .prod{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;
    display:flex;flex-direction:column}
  .prod img{width:100%;height:130px;object-fit:cover;background:var(--bg)}
  .prod .corpo{padding:11px 13px;display:flex;flex-direction:column;gap:5px;flex:1}
  .prod .nome{font-weight:700}
  .prod .desc{font-size:12.5px;color:var(--muted);flex:1}
  .prod .preco{font-weight:800;color:var(--verde)}
  .prod .pe{display:flex;align-items:center;gap:8px;padding:0 13px 12px}
  .cat{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;
    background:var(--azul)22;color:var(--azul);border-radius:6px;padding:2px 7px}
  .vazio{color:var(--muted);text-align:center;padding:30px}
  .aviso{border-radius:10px;padding:11px 14px;margin-bottom:14px;font-size:13.5px}
  .aviso.ok{background:#16a34a1f;color:var(--verde)}
  .aviso.erro{background:#dc26261f;color:var(--vermelho)}
  .aviso.info{background:#d976061f;color:var(--amarelo)}
  .carrinho{position:sticky;top:14px}
  .item{display:flex;align-items:center;gap:9px;padding:7px 0;border-bottom:1px solid var(--line);
    font-size:13.5px}
  .item:last-child{border-bottom:0}
  .item .x{margin-left:auto;background:0;border:0;color:var(--vermelho);cursor:pointer;font-size:17px}
  .total{display:flex;justify-content:space-between;font-weight:800;padding-top:11px;
    border-top:1px solid var(--line);margin-top:9px}
</style>
</head>
<body>
<header>
  <div>
    <h1>App-Venda · administração</h1>
    <div class="sub">Salão, cozinha, caixa e módulos. A tela do cliente é a <code>mesa.html</code>.</div>
  </div>
  <div class="api">
    <span class="pino" id="pino"></span>
    <label for="apiUrl" style="margin:0">API</label>
    <input id="apiUrl" spellcheck="false">
  </div>
</header>

<main>
  <div id="avisoApi"></div>
  <div class="abas">
    <button data-aba="mesas" class="on">Mesas e QR</button>
    <button data-aba="cozinha">Cozinha</button>
    <button data-aba="caixa">Caixa</button>
    <button data-aba="admin">Produtos</button>
    <button data-aba="config">Módulos</button>
    <button data-aba="conta">Conta</button>
  </div>
  <div id="tela"></div>
</main>

<script>
// A pagina e estatica (GitHub Pages) e conversa com a API que roda na MAQUINA de
// quem abre. Por isso o endereco e editavel e fica guardado: em localhost cada um
// roda a sua, e um dia isso pode virar um servidor de verdade sem mexer no HTML.
//
// Navegador bloqueia HTTP dentro de pagina HTTPS -- menos para localhost, que o
// Chrome trata como origem confiavel. E por isso que este arranjo funciona.
var API = localStorage.getItem('appvenda-api') || 'http://localhost:3001';
var ABA = 'mesas', PRODUTOS = [], USUARIO = null;

// Esta pagina e SO administrativa. Quem pede e o cliente, na mesa.html, que abre
// pelo QR -- por isso aqui nao ha carrinho nem seletor de mesa para pedir.
var MESAS = [], COMANDAS = [], COMANDA = null, FILA = [], QR = null;

// Espelho da configuracao do estabelecimento. A tela nao decide nada sobre
// pagamento: ela pergunta ao servidor quais botoes existem.
var CFG = {};
var RELOGIO = null;

var $ = function (s) { return document.querySelector(s); };
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function moeda(v){ return 'R$ ' + Number(v).toFixed(2).replace('.', ','); }

function aviso(onde, tipo, txt){
  var el = typeof onde === 'string' ? $(onde) : onde;
  if (el) el.innerHTML = '<div class="aviso ' + tipo + '">' + esc(txt) + '</div>';
}

// ---------------------------------------------------------------- API
async function api(caminho, opcoes){
  var r = await fetch(API + caminho, opcoes);
  var txt = await r.text();
  var dados = null;
  try { dados = txt ? JSON.parse(txt) : null; } catch (e) { dados = { message: txt }; }
  if (!r.ok) throw new Error((dados && (dados.message || dados.error)) || ('HTTP ' + r.status));
  return dados;
}

async function pingApi(){
  var p = $('#pino');
  try {
    await api('/health');
    p.className = 'pino on';
    $('#avisoApi').innerHTML = '';
    return true;
  } catch (e) {
    p.className = 'pino off';
    aviso('#avisoApi', 'info',
      'A API não respondeu em ' + API + '. Ela roda na sua máquina: suba o Postgres ' +
      '(docker compose up -d) e depois npm start, dentro da pasta do projeto.');
    return false;
  }
}

// ---------------------------------------------------------------- telas
function pinta(){
  document.querySelectorAll('[data-aba]').forEach(function(b){
    b.className = b.getAttribute('data-aba') === ABA ? 'on' : '';
  });
  // A cozinha se atualiza sozinha; sair da aba precisa parar o relogio, senao
  // ele continua batendo na API no fundo pelo resto da sessao.
  if (RELOGIO) { clearInterval(RELOGIO); RELOGIO = null; }
  if (ABA === 'mesas')    return telaMesas();
  if (ABA === 'cozinha')  return telaCozinha();
  if (ABA === 'caixa')    return telaCaixa();
  if (ABA === 'admin')    return telaAdmin();
  if (ABA === 'config')   return telaConfig();
  return telaConta();
}

// Modo de pagamento vigente, traduzido para o que a tela do cliente mostra.
function modoPagamento(){
  var modo = CFG['pagamento.modo'] || 'fechamento';
  var integrado = CFG['pagamento.integrado'] === 'true';
  return {
    modo: modo,
    podePagarAgora: integrado && (modo === 'antecipado' || modo === 'ambos'),
    exigePagar: integrado && modo === 'antecipado',
    texto: modo === 'antecipado' && integrado
      ? 'A cozinha só recebe depois do pagamento aprovado.'
      : (modo === 'ambos' && integrado
        ? 'Você escolhe: pagar agora ou deixar na conta da mesa.'
        : 'O pedido vai direto para a cozinha. A conta fica aberta e é paga no caixa.')
  };
}

// ------------------------------------------------------------------ mesas
// Mesa e QR andam juntos: criar a mesa nao basta, e o adesivo que faz o cliente
// chegar ao cardapio. Por isso gerar, regerar e revogar ficam na mesma tela.
function telaMesas(){
  $('#tela').innerHTML =
    '<div class="cartao"><h2>Mesas e QR codes</h2>' +
      '<div id="msgMesa"></div>' +
      '<div id="listaMesas"></div>' +
      '<div class="linha" style="grid-template-columns:140px auto;align-items:end;margin:14px 0 0">' +
        '<div><label>Número da mesa</label><input id="mNumero" type="number" min="1"></div>' +
        '<div><button class="acao" id="mCriar">Criar mesa</button></div>' +
      '</div>' +
    '</div>' +
    '<div id="qrAberto"></div>' +
    '<div class="cartao"><h2>Para onde o QR aponta</h2>' +
      '<div id="msgUrl"></div>' +
      '<p style="color:var(--muted);font-size:13px;margin-top:0">' +
        'O QR leva o celular do cliente até a tela de pedidos. Trocar estes endereços ' +
        'muda os QR codes <b>que ainda vão ser gerados</b> — os já impressos continuam ' +
        'apontando para o endereço antigo.</p>' +
      '<div style="margin-bottom:12px"><label>Tela do cliente</label>' +
        '<input id="uCliente" value="' + esc(CFG['cliente.url'] || '') + '"></div>' +
      '<div style="margin-bottom:14px"><label>API vista pelo celular ' +
        '<span style="font-weight:400;color:var(--muted)">(em branco = o navegador decide)</span></label>' +
        '<input id="uApi" value="' + esc(CFG['api.publica'] || '') + '" ' +
          'placeholder="http://192.168.0.10:3001"></div>' +
      '<button class="acao" id="uSalvar">Salvar endereços</button>' +
      '<p style="color:var(--muted);font-size:12.5px;margin-bottom:0">' +
        'No celular do cliente, <code>localhost</code> é o próprio celular — por isso, para ' +
        'testar com um telefone de verdade, use o IP da sua máquina na rede.</p>' +
    '</div>';

  pintaMesas();

  $('#mCriar').onclick = async function(){
    try {
      await api('/api/mesas', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ numero: Number($('#mNumero').value) })
      });
      await carregaBase();
      pinta();
    } catch (e) { aviso('#msgMesa', 'erro', e.message); }
  };

  $('#uSalvar').onclick = async function(){
    try {
      CFG = await api('/api/configuracoes', {
        method: 'PUT', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ 'cliente.url': $('#uCliente').value, 'api.publica': $('#uApi').value })
      });
      aviso('#msgUrl', 'ok', 'Endereços salvos.');
    } catch (e) { aviso('#msgUrl', 'erro', e.message); }
  };
}

function pintaMesas(){
  var el = $('#listaMesas');
  if (!el) return;
  if (!MESAS.length){
    el.innerHTML = '<div class="vazio">Nenhuma mesa ainda. O QR precisa de uma.</div>';
    return;
  }
  el.innerHTML = MESAS.map(function(m){
    return '<div class="item" style="flex-wrap:wrap">' +
      '<b style="min-width:70px">Mesa ' + m.numero + '</b>' +
      '<span style="color:var(--muted);font-size:12.5px;min-width:110px">' +
        (m.comanda_id ? 'conta aberta' : 'livre') + '</span>' +
      '<span class="cat" style="background:' + (m.qr_token ? '' : 'transparent') + '">' +
        (m.qr_token ? 'QR ativo' : 'sem QR') + '</span>' +
      '<span style="margin-left:auto;display:flex;gap:6px;flex-wrap:wrap">' +
        (m.qr_token
          ? '<button class="acao sec" data-ver="' + m.id + '" style="padding:5px 11px;font-size:12.5px">Ver</button>' +
            '<button class="acao sec" data-gerar="' + m.id + '" style="padding:5px 11px;font-size:12.5px">Regerar</button>' +
            '<button class="acao sec perigo" data-revogar="' + m.id + '" style="padding:5px 11px;font-size:12.5px;color:#fff">Excluir QR</button>'
          : '<button class="acao" data-gerar="' + m.id + '" style="padding:5px 11px;font-size:12.5px">Gerar QR</button>') +
      '</span></div>';
  }).join('');

  el.querySelectorAll('[data-gerar]').forEach(function(b){
    b.onclick = async function(){
      var id = Number(b.getAttribute('data-gerar'));
      // Regerar invalida o adesivo que esta colado na mesa: confirma antes.
      var tinha = MESAS.filter(function(m){ return m.id === id; })[0].qr_token;
      if (tinha && !confirm('Gerar outro QR faz o adesivo atual parar de funcionar. Continuar?')) return;
      try {
        QR = await api('/api/mesas/' + id + '/qrcode', { method: 'POST' });
        await carregaBase();
        pinta();
        mostraQr();
      } catch (e) { aviso('#msgMesa', 'erro', e.message); }
    };
  });

  el.querySelectorAll('[data-revogar]').forEach(function(b){
    b.onclick = async function(){
      if (!confirm('Excluir o QR desta mesa? O adesivo impresso deixa de abrir.')) return;
      try {
        var r = await api('/api/mesas/' + b.getAttribute('data-revogar') + '/qrcode', { method: 'DELETE' });
        QR = null;
        await carregaBase();
        pinta();
        aviso('#msgMesa', 'ok', r.message);
      } catch (e) { aviso('#msgMesa', 'erro', e.message); }
    };
  });

  el.querySelectorAll('[data-ver]').forEach(function(b){
    b.onclick = async function(){
      var id = Number(b.getAttribute('data-ver'));
      var m = MESAS.filter(function(x){ return x.id === id; })[0];
      try {
        // Pede o SVG pronto ao servidor: desenhar QR no navegador exigiria uma
        // biblioteca a mais, e a pagina nao tem build nem CDN.
        var svg = await (await fetch(API + '/api/mesas/' + id + '/qrcode.svg')).text();
        QR = { mesa: m, svg: svg, url: null };
        mostraQr();
      } catch (e) { aviso('#msgMesa', 'erro', e.message); }
    };
  });
}

function mostraQr(){
  var el = $('#qrAberto');
  if (!el || !QR) return;
  var url = QR.url || ((CFG['cliente.url'] || '') + '?t=' + QR.mesa.qr_token +
    (CFG['api.publica'] ? '&api=' + encodeURIComponent(CFG['api.publica']) : ''));
  el.innerHTML =
    '<div class="cartao"><h2>QR da mesa ' + QR.mesa.numero + '</h2>' +
      '<div class="linha" style="grid-template-columns:200px 1fr;align-items:start">' +
        '<div id="qrDesenho" style="background:#fff;border-radius:12px;padding:10px"></div>' +
        '<div>' +
          '<label>Endereço dentro do QR</label>' +
          '<input readonly value="' + esc(url) + '" onclick="this.select()">' +
          '<div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap">' +
            '<button class="acao sec" id="qrImprimir">Imprimir</button>' +
            '<button class="acao sec" id="qrAbrir">Abrir a tela do cliente</button>' +
            '<button class="acao sec" id="qrFechar">Fechar</button>' +
          '</div>' +
          '<p style="color:var(--muted);font-size:12.5px">Imprima, plastifique e cole na mesa. ' +
            'Se o adesivo for fotografado por alguém de fora, é só <b>regerar</b>: o antigo morre na hora.</p>' +
        '</div>' +
      '</div>' +
    '</div>';
  // innerHTML com SVG vindo do servidor: o conteudo e gerado pela biblioteca de
  // QR a partir da URL, nao e texto de usuario.
  $('#qrDesenho').innerHTML = QR.svg;
  $('#qrFechar').onclick = function(){ QR = null; $('#qrAberto').innerHTML = ''; };
  $('#qrAbrir').onclick = function(){ window.open(url, '_blank'); };
  $('#qrImprimir').onclick = function(){
    var j = window.open('', '_blank');
    j.document.write('<!doctype html><title>Mesa ' + QR.mesa.numero + '</title>' +
      '<style>body{font:16px system-ui;text-align:center;padding:40px}' +
      'svg{width:280px;height:280px}h1{font-size:34px;margin:0 0 6px}</style>' +
      '<h1>Mesa ' + QR.mesa.numero + '</h1><p>Aponte a câmera para pedir</p>' + QR.svg);
    j.document.close();
    j.focus();
    j.print();
  };
}

function telaAdmin(){
  $('#tela').innerHTML =
    '<div class="cartao"><h2>Cadastrar produto</h2>' +
      '<div id="msgProd"></div>' +
      '<div class="linha">' +
        '<div><label>Nome</label><input id="pNome"></div>' +
        '<div><label>Preço</label><input id="pPreco" type="number" step="0.01" min="0"></div>' +
      '</div>' +
      '<div class="linha">' +
        '<div><label>Quantidade</label><input id="pQtd" type="number" min="0" value="1"></div>' +
        '<div><label>Categoria</label><input id="pCat" placeholder="bebidas, comidas..."></div>' +
      '</div>' +
      '<div style="margin-bottom:12px"><label>Descrição</label><input id="pDesc"></div>' +
      '<div style="margin-bottom:14px"><label>Imagem</label><input id="pImg" type="file" accept="image/*"></div>' +
      '<button class="acao" id="pSalvar">Cadastrar</button>' +
    '</div>' +
    '<div class="cartao"><h2>Produtos em estoque</h2><div id="lista"></div></div>';
  $('#pSalvar').onclick = cadastraProduto;
  pintaLista();
}

function pintaLista(){
  var el = $('#lista');
  if (!el) return;
  if (!PRODUTOS.length){ el.innerHTML = '<div class="vazio">Nada cadastrado.</div>'; return; }
  el.innerHTML = PRODUTOS.map(function(p){
    return '<div class="item"><b>' + esc(p.nomeproduto) + '</b>' +
      '<span class="cat">' + esc(p.categoria || '-') + '</span>' +
      '<span style="color:var(--muted)">' + moeda(p.precoproduto) + ' · ' +
        p.quantidadeproduto + ' un.</span>' +
      // Disponibilidade e o controle de estoque do modo desligado -- e o atalho
      // para tirar do ar o prato que acabou, com o estoque ligado ou nao.
      '<button class="acao sec" data-disp="' + p.idnomeproduto + ':' + (p.disponivel ? '0' : '1') + '" ' +
        'style="margin-left:auto;padding:5px 11px;font-size:12.5px' +
        (p.disponivel ? '' : ';color:var(--vermelho)') + '">' +
        (p.disponivel ? 'Disponível' : 'Indisponível') + '</button>' +
      '<button class="x" data-del="' + p.idnomeproduto + '" title="Excluir">×</button></div>';
  }).join('');
  el.querySelectorAll('[data-disp]').forEach(function(b){
    b.onclick = async function(){
      var p = b.getAttribute('data-disp').split(':');
      try {
        await api('/produtos/' + p[0] + '/disponibilidade', {
          method: 'PATCH', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ disponivel: p[1] === '1' })
        });
        await carregaProdutos();
      } catch (e) { aviso('#msgProd', 'erro', e.message); }
    };
  });
  el.querySelectorAll('[data-del]').forEach(function(b){
    b.onclick = async function(){
      if (!confirm('Excluir este produto?')) return;
      try {
        await api('/produtos/' + b.getAttribute('data-del'), { method: 'DELETE' });
        await carregaProdutos();
        pintaLista();
      } catch (e) { aviso('#msgProd', 'erro', e.message); }
    };
  });
}

async function cadastraProduto(){
  var fd = new FormData();
  fd.append('nomeProduto', $('#pNome').value);
  fd.append('precoProduto', $('#pPreco').value);
  fd.append('descricaoProduto', $('#pDesc').value);
  fd.append('quantidadeProduto', $('#pQtd').value);
  fd.append('categoria', $('#pCat').value);
  if ($('#pImg').files[0]) fd.append('imagemProduto', $('#pImg').files[0]);
  var b = $('#pSalvar');
  b.disabled = true; b.textContent = 'Cadastrando...';
  try {
    await api('/api/cadastrarProduto', { method: 'POST', body: fd });
    aviso('#msgProd', 'ok', 'Produto cadastrado.');
    ['#pNome','#pPreco','#pDesc','#pCat','#pImg'].forEach(function(s){ $(s).value = ''; });
    await carregaProdutos();
    pintaLista();
  } catch (e) {
    aviso('#msgProd', 'erro', e.message);
  } finally {
    b.disabled = false; b.textContent = 'Cadastrar';
  }
}

// ---------------------------------------------------------------- cozinha
function telaCozinha(){
  $('#tela').innerHTML =
    '<div class="cartao" style="display:flex;align-items:center;gap:12px">' +
      '<h2 style="margin:0">Fila de produção</h2>' +
      '<span style="color:var(--muted);font-size:13px" id="cozResumo"></span>' +
      '<button class="acao sec" id="cozAtualiza" style="margin-left:auto">Atualizar</button>' +
    '</div><div id="colunas"></div>';
  $('#cozAtualiza').onclick = carregaFila;
  carregaFila();
  // A cozinha nao e clicada para atualizar: a tela fica numa TV, de longe.
  RELOGIO = setInterval(carregaFila, 10000);
}

async function carregaFila(){
  try { FILA = await api('/api/cozinha'); } catch (e) { FILA = []; }
  var col = $('#colunas');
  if (!col) return;
  var grupos = [
    { nome: 'Novos', status: 'novo', acao: 'preparo', rotulo: 'Iniciar preparo' },
    { nome: 'Em preparo', status: 'preparo', acao: 'pronto', rotulo: 'Marcar pronto' },
    { nome: 'Prontos', status: 'pronto', acao: 'entregue', rotulo: 'Entregue' }
  ];
  if ($('#cozResumo')) $('#cozResumo').textContent = FILA.length + ' na fila';

  col.innerHTML = '<div class="linha" style="grid-template-columns:repeat(3,1fr);align-items:start">' +
    grupos.map(function(g){
      var cards = FILA.filter(function(p){ return p.status === g.status; });
      return '<div><h2 style="font-size:14px;margin:0 0 10px">' + g.nome +
        ' <span style="color:var(--muted)">' + cards.length + '</span></h2>' +
        (cards.length ? cards.map(function(p){
          // Mais de 20 minutos na fila fica em vermelho: e o unico alarme da tela.
          var atrasado = p.segundos_na_fila > 1200;
          return '<div class="cartao" style="padding:13px;margin-bottom:10px' +
            (atrasado ? ';border-color:var(--vermelho)' : '') + '">' +
            '<div style="display:flex;align-items:baseline;gap:8px">' +
              '<b style="font-size:17px">Mesa ' + p.mesa + '</b>' +
              '<span style="color:var(--muted);font-size:12px">#' + p.id + '</span>' +
              '<span style="margin-left:auto;font-weight:700' +
                (atrasado ? ';color:var(--vermelho)' : '') + '">' +
                Math.floor((p.segundos_na_fila || 0) / 60) + ' min</span>' +
            '</div>' +
            p.itens.map(function(i){
              return '<div style="margin-top:7px"><b>' + i.quantidade + '×</b> ' + esc(i.nome) +
                (i.observacao
                  ? '<div style="font-size:12.5px;color:var(--amarelo)">' + esc(i.observacao) + '</div>'
                  : '') + '</div>';
            }).join('') +
            (p.cliente ? '<div style="font-size:12px;color:var(--muted);margin-top:7px">' +
              esc(p.cliente) + '</div>' : '') +
            '<button class="acao" data-etapa="' + p.id + ':' + g.acao + '" ' +
              'style="width:100%;margin-top:10px">' + g.rotulo + '</button>' +
          '</div>';
        }).join('') : '<div class="vazio" style="padding:16px">—</div>') +
      '</div>';
    }).join('') + '</div>';

  col.querySelectorAll('[data-etapa]').forEach(function(b){
    b.onclick = async function(){
      var p = b.getAttribute('data-etapa').split(':');
      b.disabled = true;
      try { await api('/api/pedidos/' + p[0] + '/' + p[1], { method: 'POST' }); }
      catch (e) { alert(e.message); }
      carregaFila();
    };
  });
}

// ------------------------------------------------------------------ caixa
function telaCaixa(){
  $('#tela').innerHTML =
    '<div class="linha" style="grid-template-columns:260px 1fr;align-items:start">' +
      '<div class="cartao"><h2>Comandas abertas</h2><div id="listaComandas"></div></div>' +
      '<div id="detalheComanda"></div>' +
    '</div>';
  carregaComandas();
}

async function carregaComandas(){
  try { COMANDAS = await api('/api/comandas?status=aberta'); } catch (e) { COMANDAS = []; }
  var el = $('#listaComandas');
  if (!el) return;
  el.innerHTML = COMANDAS.length ? COMANDAS.map(function(c){
    return '<div class="item" style="cursor:pointer" data-cmd="' + c.id + '">' +
      '<b>Mesa ' + c.mesa + '</b>' +
      '<span style="margin-left:auto;font-weight:700">' + moeda(c.totais.total) + '</span></div>';
  }).join('') : '<div class="vazio" style="padding:14px">Nenhuma conta aberta.</div>';
  el.querySelectorAll('[data-cmd]').forEach(function(d){
    d.onclick = function(){ abreComanda(Number(d.getAttribute('data-cmd'))); };
  });
  if (COMANDA) abreComanda(COMANDA);
}

async function abreComanda(id){
  COMANDA = id;
  var d;
  try { d = await api('/api/comandas/' + id); }
  catch (e) { return aviso('#detalheComanda', 'erro', e.message); }

  var el = $('#detalheComanda');
  if (!el) return;
  var itens = [];
  d.pedidos.forEach(function(p){
    if (p.status === 'cancelado') return;
    p.itens.forEach(function(i){ itens.push(i); });
  });

  el.innerHTML =
    '<div class="cartao"><h2>Mesa ' + d.comanda.mesa + '</h2>' +
      '<div id="msgCaixa"></div>' +
      (itens.length ? itens.map(function(i){
        return '<div class="item"><b>' + i.quantidade + '×</b> ' + esc(i.nome) +
          (i.observacao ? '<span style="color:var(--muted);font-size:12px">' +
            esc(i.observacao) + '</span>' : '') +
          '<span style="margin-left:auto">' + moeda(i.preco * i.quantidade) + '</span></div>';
      }).join('') : '<div class="vazio" style="padding:12px">Sem consumo.</div>') +
      '<div class="linha" style="margin-top:14px">' +
        '<div><label>Serviço 10%</label>' +
          '<select id="cxServico">' +
            '<option value="1"' + (d.comanda.servico ? ' selected' : '') + '>Cobrar</option>' +
            '<option value="0"' + (d.comanda.servico ? '' : ' selected') + '>Não cobrar</option>' +
          '</select></div>' +
        '<div><label>Desconto</label>' +
          '<input id="cxDesconto" type="number" step="0.01" min="0" value="' +
            Number(d.comanda.desconto) + '"></div>' +
      '</div>' +
      '<div class="total"><span>Consumo</span><span>' + moeda(d.totais.consumo) + '</span></div>' +
      '<div class="item"><span>Serviço</span><span style="margin-left:auto">' +
        moeda(d.totais.servico) + '</span></div>' +
      '<div class="item"><span>Já pago</span><span style="margin-left:auto">' +
        moeda(d.totais.pago) + '</span></div>' +
      '<div class="total"><span>Falta</span><span>' + moeda(d.totais.saldo) + '</span></div>' +
    '</div>' +
    '<div class="cartao"><h2>Receber</h2>' +
      '<div class="linha">' +
        '<div><label>Forma</label><select id="cxForma">' +
          '<option value="dinheiro">Dinheiro</option>' +
          '<option value="cartao_maquina">Cartão na maquininha</option>' +
          '<option value="pix_chave">Pix na chave da casa</option>' +
        '</select></div>' +
        '<div><label>Valor</label><input id="cxValor" type="number" step="0.01" min="0" value="' +
          d.totais.saldo + '"></div>' +
      '</div>' +
      '<div style="display:flex;gap:9px">' +
        '<button class="acao" id="cxReceber">Receber</button>' +
        '<button class="acao sec" id="cxFechar">Fechar mesa</button>' +
      '</div>' +
      '<div style="font-size:12.5px;color:var(--muted);margin-top:10px">' +
        'Dinheiro, maquininha e Pix na chave funcionam com o módulo de pagamento desligado.</div>' +
    '</div>';

  $('#cxServico').onchange = $('#cxDesconto').onchange = async function(){
    try {
      await api('/api/comandas/' + id, {
        method: 'PATCH', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          servico: $('#cxServico').value === '1',
          desconto: Number($('#cxDesconto').value || 0)
        })
      });
      abreComanda(id);
    } catch (e) { aviso('#msgCaixa', 'erro', e.message); }
  };
  $('#cxReceber').onclick = async function(){
    try {
      await api('/api/comandas/' + id + '/pagamentos', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ forma: $('#cxForma').value, valor: Number($('#cxValor').value) })
      });
      abreComanda(id);
    } catch (e) { aviso('#msgCaixa', 'erro', e.message); }
  };
  $('#cxFechar').onclick = async function(){
    try {
      await api('/api/comandas/' + id + '/fechar', { method: 'POST' });
      COMANDA = null;
      $('#detalheComanda').innerHTML = '<div class="cartao"><div class="aviso ok">Mesa fechada.</div></div>';
      await carregaBase();
      carregaComandas();
    } catch (e) { aviso('#msgCaixa', 'erro', e.message); }
  };
}

// ------------------------------------------------------------- modulos
function telaConfig(){
  function opc(chave, valores, rotulos){
    return '<select id="cfg_' + chave.replace('.', '_') + '" data-chave="' + chave + '">' +
      valores.map(function(v, n){
        return '<option value="' + v + '"' + (CFG[chave] === v ? ' selected' : '') + '>' +
          rotulos[n] + '</option>';
      }).join('') + '</select>';
  }

  $('#tela').innerHTML =
    '<div class="cartao"><h2>Módulos do estabelecimento</h2>' +
      '<div id="msgCfg"></div>' +
      '<p style="color:var(--muted);font-size:13px;margin-top:0">' +
        'O fluxo QR → pedido → cozinha → comanda → caixa funciona com tudo desligado. ' +
        'Nada aqui muda o caminho do pedido, só quem entra nele.</p>' +
      '<div class="linha">' +
        '<div><label>Quando o cliente paga</label>' +
          opc('pagamento.modo', ['fechamento', 'antecipado', 'ambos'],
              ['No fechamento (padrão)', 'Antecipado por pedido', 'Permitir os dois']) + '</div>' +
        '<div><label>Pagamento integrado (Pix/cartão no app)</label>' +
          opc('pagamento.integrado', ['false', 'true'], ['Desligado', 'Ligado']) + '</div>' +
      '</div>' +
      '<div class="linha">' +
        '<div><label>Controle de estoque</label>' +
          opc('estoque.modo', ['desligado', 'simples', 'ingrediente'],
              ['Desligado (só disponível/indisponível)', 'Simples (unidades do prato)',
               'Por ingrediente (ficha técnica)']) + '</div>' +
        '<div><label>Relatórios financeiros</label>' +
          opc('financeiro.ativo', ['true', 'false'], ['Ligados', 'Desligados']) + '</div>' +
      '</div>' +
      '<div class="linha"><div><label>Serviço (%)</label>' +
        '<input id="cfg_servico" type="number" min="0" max="100" value="' +
        (CFG['servico.percentual'] || '10') + '"></div><div></div></div>' +
      '<button class="acao" id="cfgSalvar">Salvar</button>' +
    '</div>' +
    '<div class="cartao"><h2>Como fica o fluxo</h2>' +
      '<div style="line-height:2">' +
        '1 · QR da mesa<br>2 · Pedido confirmado<br>' +
        '3 · Cozinha <span style="color:var(--muted)">(' +
          (modoPagamento().exigePagar ? 'entra após o pagamento aprovado' : 'entra na confirmação') +
        ')</span><br>' +
        '4 · Comanda aberta<br>5 · Caixa e fechamento' +
      '</div>' +
      '<div style="margin-top:14px;font-size:13px;color:var(--muted)">' +
        'Pagamento integrado: ' + (CFG['pagamento.integrado'] === 'true' ? 'ligado' : 'fora do caminho') + '<br>' +
        'Estoque: ' + (CFG['estoque.modo'] === 'desligado' ? 'fora do caminho' : CFG['estoque.modo']) + '<br>' +
        'Financeiro: ' + (CFG['financeiro.ativo'] === 'true' ? 'lê, não bloqueia' : 'desligado') +
      '</div>' +
    '</div>';

  $('#cfgSalvar').onclick = async function(){
    var corpo = { 'servico.percentual': $('#cfg_servico').value };
    document.querySelectorAll('[data-chave]').forEach(function(s){
      corpo[s.getAttribute('data-chave')] = s.value;
    });
    try {
      CFG = await api('/api/configuracoes', {
        method: 'PUT', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(corpo)
      });
      pinta();
      aviso('#msgCfg', 'ok', 'Salvo. Vale para o próximo pedido, sem reiniciar nada.');
    } catch (e) {
      aviso('#msgCfg', 'erro', e.message);
    }
  };
}

function telaConta(){
  $('#tela').innerHTML =
    '<div class="linha" style="grid-template-columns:1fr 1fr;align-items:start">' +
      '<div class="cartao"><h2>Entrar</h2><div id="msgLogin"></div>' +
        '<div style="margin-bottom:12px"><label>Login</label><input id="lLogin"></div>' +
        '<div style="margin-bottom:14px"><label>Senha</label><input id="lSenha" type="password"></div>' +
        '<button class="acao" id="bEntrar">Entrar</button>' +
        (USUARIO ? '<p style="color:var(--verde);margin:12px 0 0">Conectado como <b>' +
          esc(USUARIO.login) + '</b></p>' : '') +
      '</div>' +
      '<div class="cartao"><h2>Criar conta</h2><div id="msgCad"></div>' +
        '<div style="margin-bottom:12px"><label>Login</label><input id="cLogin"></div>' +
        '<div style="margin-bottom:12px"><label>E-mail</label><input id="cEmail" type="email"></div>' +
        '<div style="margin-bottom:12px"><label>CPF</label><input id="cCpf"></div>' +
        '<div style="margin-bottom:14px"><label>Senha</label>' +
          '<input id="cSenha" type="password" minlength="6">' +
          '<div style="font-size:12px;color:var(--muted);margin-top:4px">Ao menos 6 caracteres. ' +
          'Guardada como hash: nem o servidor consegue ler de volta.</div></div>' +
        '<button class="acao" id="bCriar">Cadastrar</button>' +
      '</div>' +
    '</div>';
  $('#bEntrar').onclick = async function(){
    try {
      // POST: a senha vai no corpo. Na URL ela ficaria no historico do navegador.
      USUARIO = await api('/api/login', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ login: $('#lLogin').value, senha: $('#lSenha').value })
      });
      pinta();
    } catch (e) { aviso('#msgLogin', 'erro', e.message); }
  };
  $('#bCriar').onclick = async function(){
    try {
      await api('/api/cadastrarUsuario', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ login: $('#cLogin').value, email: $('#cEmail').value,
                               cpf: $('#cCpf').value, senha: $('#cSenha').value })
      });
      aviso('#msgCad', 'ok', 'Conta criada. Já dá para entrar.');
    } catch (e) { aviso('#msgCad', 'erro', e.message); }
  };
}

// ---------------------------------------------------------------- carga
async function carregaProdutos(categoria){
  try {
    PRODUTOS = await api('/produtos' + (categoria ? '?categoria=' + encodeURIComponent(categoria) : ''));
  } catch (e) {
    PRODUTOS = [];
  }
  pintaLista();
}

// Configuracao e mesas: o resto da tela depende das duas, entao carregam juntas.
// Falha de qualquer uma cai no padrao em vez de deixar a pagina em branco.
async function carregaBase(){
  try { CFG = await api('/api/configuracoes'); }
  catch (e) { CFG = { 'pagamento.modo': 'fechamento', 'pagamento.integrado': 'false',
                      'estoque.modo': 'desligado', 'financeiro.ativo': 'true',
                      'servico.percentual': '10' }; }
  try { MESAS = await api('/api/mesas'); } catch (e) { MESAS = []; }
}

$('#apiUrl').value = API;
$('#apiUrl').onchange = async function(){
  API = this.value.replace(/\/+$/, '');
  localStorage.setItem('appvenda-api', API);
  if (await pingApi()) { await carregaBase(); await carregaProdutos(); }
  pinta();
};
document.querySelectorAll('[data-aba]').forEach(function(b){
  b.onclick = function(){ ABA = b.getAttribute('data-aba'); pinta(); };
});

(async function(){
  pinta();
  if (await pingApi()) { await carregaBase(); await carregaProdutos(); }
  pinta();
})();
</script>
